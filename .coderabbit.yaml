# CodeRabbit review settings for the plugins. Reviews pull requests only.
# Kept quiet on purpose: findings, not prose.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/go.sum"
    # Vendored upstream code; only its README / patch notes are ours.
    - "!openconnect/third_party/**/*.go"
  pre_merge_checks:
    # Code here is documented with comments where they carry the why, not
    # with a docstring on every function: the coverage check only fails.
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Protocol and docs"
        mode: warning
        instructions: |
          Pass when the PR changes no event, command or field of the
          helper protocol and no user-visible behaviour of a plugin
          (flags, environment variables, build or release steps), or when
          it does and also updates the matching text: PROTOCOL.md for the
          protocol, README.md for build, release or plugin-specific
          behaviour. Fail and name the missing file otherwise. Internal
          refactors, tests, dependency bumps and CI-only changes pass.
  path_instructions:
    - path: "**/*"
      instructions: |
        House rules - flag a change that breaks one:
        - No em-dashes or en-dashes anywhere (code, comments, docs, commit
          text); use " - ".
        - No emojis.
        - No sensitive data in repo files: real email addresses, internal
          hostnames or IPs, customer names, tokens. Examples use
          example.com.
        - Each plugin is its own Go module with its own licence and tag
          namespace (<plugin>-vN); the wire protocol is PROTOCOL.md, and
          a change to it needs the app's side too.
    - path: "netbird/go.mod"
      instructions: |
        The replace set must mirror the replaces in the go.mod of the
        pinned github.com/netbirdio/netbird version; flag a version change
        without the matching replace set.
    - path: "**/*.go"
      instructions: |
        Each plugin is a sidecar the app spawns: line-delimited JSON events
        on stdout (stdout is the protocol - logs go to stderr), commands on
        stdin, a loopback SOCKS5 proxy; closing stdin stops it. Secrets
        arrive in environment variables, never argv. Look for: anything but
        protocol JSON written to stdout, secrets reaching logs or events,
        goroutine leaks and missing context cancellation on dials, locks
        held across blocking calls, errors dropped silently, a SOCKS
        request answered without a reply code, TLS verification turned off
        without a pin or CA check in its place.
    - path: "PROTOCOL.md"
      instructions: |
        The wire contract with the app (ssh-tool, internal/tunnelhelper):
        events, commands, fields. Flag a change to an event or field that
        is not backward compatible without a bump of the protocol version
        the ready event announces.
    - path: "README.md"
      instructions: |
        Check stated facts against the repo: tag names per plugin, build
        steps and the Go toolchain (each plugin's go.mod), the pinned
        library versions it names (go.mod), and that files and flags it
        mentions exist.
chat:
  auto_reply: true
